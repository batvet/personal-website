<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>b a t v e t</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0f12;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      animation: fadeIn 2s ease-in-out;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.05);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 4px;
      margin-bottom: 16px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 32px;
      font-weight: 300;
    }
    .pulse {
      width: 10px;
      height: 10px;
      background-color: #38bdf8;
      border-radius: 50%;
      margin: 0 auto;
      box-shadow: 0 0 0 rgba(56, 189, 248, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">BATVET.COM</div>
    <h1>QUELQUE CHOSE SE PRÉPARE</h1>
    <p>Une nouvelle perspective se dessine.<br>Revenez plus tard.</p>
    <div class="pulse"></div>
  </div>
</body>
</html>
